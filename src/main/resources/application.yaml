server:
  host: "0.0.0.0"
  port: 8080

langchain4j:
  ollama:
    chat-model:
      enabled: true
      base-url: "http://localhost:11434"
      model-name: "llama3.2"

  rag:
    embedding-store-content-retriever:
      enabled: true
      max-results: 10
      min-score: 0.6
      embedding-model: "@default"
      embedding-store: "@default"

app:
  root: "jms-docs"
  inclusions: "*.txt"
